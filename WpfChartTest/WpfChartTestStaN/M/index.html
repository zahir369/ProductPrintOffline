    <link rel="stylesheet" type="text/css" href="../EChart/style/index.css" />

    <script src="../echart/echarts.common.js"></script>
    <script src="../echart/echarts.esm.js"></script>
    <script src="../echart/echarts.js"></script>
    <script src="../EChart/jquery/jquery-1.11.3.min.js"></script>
    <script src="../EChart/jquery/idangerous.swiper2.7.6.min.js"></script>

    <title>环境数据</title>

</head>

<body style="margin: 0">
    <div class="wrapper">
        <div class="container">
            <!-- <div id="containerKQZLBiaoTi" class="item-zhiliangbiaoti">
                <div id="divWeiZhi" class="biaoti">现场环境空气质量</div>
                <div id="containerKQZL" class="zhiliang"></div>
            </div> -->
            <!--<div id="containerShiDu" class="item-shidu"></div>-->
            <!-- <div id="containerFourPie" class="item-fourpie">
                <div id="containerWenDu" class="item-wendu"></div>
                <div id="containerPM25" class="item-pm25"></div>
                <div id="containerVOC" class="item-voc"></div>
                <div id="containerCO2" class="item-co2"></div>

            <div class="yibiaoPan">
                <div class="yibiao-bg">
                    <h3 class="smart-title">室内空气质量</h3>
                    <div class="item-zhiliangbiaoti">
                        <div id="containerKQZLBiaoTi" class="zhiliangbiaoti-main">
                            <div id="divWeiZhi" class="biaoti">现场环境空气质量</div>
                            <div id="containerKQZL" class="zhiliang"></div>
                            <div class="biao-zhuangtai">良</div>
                        </div>
                    </div>

                    <div id="containerFourPie" class="item-fourpie">
                        <div class="item-wendu">
                            <div id="containerWenDu" class="wendu-main"></div>
                            <div class="biao-zhuangtai">良</div>
                        </div>
                        <div class="item-pm25">
                            <div id="containerPM25" class="wendu-main"></div>
                            <div class="biao-zhuangtai">良</div>
                        </div>
                        <div class="item-voc">
                            <div id="containerVOC" class="voc-main"></div>
                            <div class="biao-zhuangtai">良</div>
                        </div>
                        <div class="item-co2">
                            <div id="containerCO2" class="co2-main"></div>
                            <div class="biao-zhuangtai">良</div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="item-quxian">
                <div class="quxian-bg">
                    <ul class="quxian_tab">
                        <li>温度</li>
                        <li>湿度</li>
                        <li>CO2</li>
                        <li>PM2.5</li>
                        <li>甲醛</li>
                    </ul>
                    <div class="swiper-container quxian_swiper">
                        <div class="swiper-wrapper">
                            <div id="containerQuXianWenDu" class="swiper-slide">slider1</div>
                            <div id="containerQuXianShiDu" class="swiper-slide">slider2</div>
                            <div id="containerQuXianCO2" class="swiper-slide">slider3</div>
                            <div id="containerQuXianPM25" class="swiper-slide">slider4</div>
                            <div id="containerQuXianVOC" class="swiper-slide">slider5</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="out-env">
            <div class="env-bg">
                <h3 class="smart-title" style="left: 12px; top: 12px;">室外空气质量</h3>
                <div class="weather-top">
                    <div class="icon-box">
                        <img src="" alt="">
                    </div>
                    <div class="weather-text">
                        <h3></h3>
                        <p>空气质量：</p>
                        <div class="air-buff"></div>
                    </div>
                </div>
                <div class="city">
                    <h3></h3>
                    <img src="../Images/icon_dingwei.png" class="dingwei" />
                    <p></p>
                </div>
                <ul class="details">
                    <li>
                        <img src="../Images/icon_shidu.png" alt="">
                        <h3 class="details-name">湿度</h3>
                        <p class="details-num"></p>
                    </li>
                    <li>
                        <img src="../Images/icon_pm2.5.png" alt="">
                        <h3 class="details-name">PM2.5</h3>
                        <p class="details-num"></p>
                    </li>
                    <li>
                        <img src="../Images/icon_o3.png" alt="">
                        <!--<h3 class="details-name">O₃</h3>-->
                        <h3 class="details-name">臭氧</h3>
                        <p class="details-num"></p>
                    </li>
                    <li>
                        <img src="../Images/icon_fengsu.png" alt="">
                        <h3 class="details-name">风速</h3>
                        <p class="details-num"></p>
                    </li>
                    <li>
                        <img src="../Images/icon_raining.png" alt="">
                        <h3 class="details-name">降水量</h3>
                        <p class="details-num"></p>
                    </li>
                </ul>
                <div class="gr-line"></div>
                <ul class="near-day">
                    <h3 class="smart-title" style="left: 12px; top: 12px;">近三天天气</h3>
                    <li>
                        <p class="day-time"><span>紫外线</span></p>
                        <div class="oher-weather">
                            <img src="../Images/icon_weather.png" alt="">
                            <p class="ohter-buff"></p>
                            <p class="ohter-wendu"></p>
                            <div class="kongqi-buff"></div>
                        </div>
                    </li>
                    <li>
                        <p class="day-time">03-04 <span>紫外线</span></p>
                        <div class="oher-weather">
                            <img src="../Images/icon_weather.png" alt="">
                            <p class="ohter-buff"></p>
                            <p class="ohter-wendu"></p>
                            <div class="kongqi-buff"></div>
                        </div>
                    </li>
                    <li>
                        <p class="day-time">03-04 <span>紫外线</span></p>
                        <div class="oher-weather">
                            <img src="../Images/icon_weather.png" alt="">
                            <p class="ohter-buff"></p>
                            <p class="ohter-wendu"></p>
                            <div class="kongqi-buff"></div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>



    <script type="text/javascript">
        //#region ////////////////////////// 交互tab

        var mySwiper = new Swiper('.quxian_swiper', {
            onTouchEnd: function (swiper_activeIndex) {
                var swiper_activeIndex = mySwiper.activeIndex;
                $('.quxian_tab li').eq(swiper_activeIndex).addClass('active').siblings().removeClass('active')
            }
        })
        $('.quxian_tab li').eq(0).addClass('active')
        $('.quxian_tab li').click(function () {
            var liIndex = $(this).index();
            $(this).addClass('active').siblings().removeClass('active')
            mySwiper.swipeTo(liIndex, 1000, false);
        })

                            //#endregion
    </script>

    <script src="../echart/chartjs/kqzl.js" type="text/javascript"></script>
    <script src="../echart/chartjs/wenshidu.js" type="text/javascript"></script>
    <script src="../echart/chartjs/pm25.js" type="text/javascript"></script>
    <script src="../echart/chartjs/co2.js" type="text/javascript"></script>
    <script src="../echart/chartjs/tvoc.js" type="text/javascript"></script>
    <script src="../echart/chartjs/quxian_wendu.js" type="text/javascript"></script>
    <script src="../echart/chartjs/quxian_shidu.js" type="text/javascript"></script>
    <script src="../echart/chartjs/quxian_co2.js" type="text/javascript"></script>
    <script src="../echart/chartjs/quxian_tvoc.js" type="text/javascript"></script>
    <script src="../echart/chartjs/quxian_pm25.js" type="text/javascript"></script>
    <script src="../echart/chartjs/initdata.js" type="text/javascript"></script>

    <script>
    </script>
</body>
</html>
